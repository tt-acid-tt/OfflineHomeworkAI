name: Request Unity Personal License
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-license:
    name: Generate Unity activation request
    runs-on: ubuntu-latest
    steps:
      - name: Generate activation file
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.40f1

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-Request
          path: Unity_v6000.0.40f1.alf
          if-no-files-found: error
          retention-days: 7
